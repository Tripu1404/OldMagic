name: Compilar Plugin sin Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Construir plugin .jar
    runs-on: ubuntu-latest

    steps:
    - name: 🧬 Clonar repositorio
      uses: actions/checkout@v3

    - name: ☕ Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: 📦 Crear carpeta de salida
      run: mkdir -p out

    - name: 🌐 Descargar Nukkit API
      run: curl -L -o nukkit.jar https://ci.opencollab.dev/job/NukkitX/job/Nukkit/job/master/lastSuccessfulBuild/artifact/target/nukkit-1.0-SNAPSHOT.jar

    - name: 🧪 Compilar código Java
      run: |
        javac -cp "nukkit.jar" -d out src/Tripu1404/fixedpotiondamage/FixedPotionDamage.java
        cp plugin.yml out/

    - name: 📁 Generar plugin JAR
      run: |
        cd out
        jar cf FixedPotionDamage.jar *

    - name: 🚀 Subir artefacto .jar
      uses: actions/upload-artifact@v4
      with:
        name: FixedPotionDamage
        path: out/FixedPotionDamage.jar
